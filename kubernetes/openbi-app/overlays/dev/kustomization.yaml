apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbi

resources:
  - ../../base

# Dev: only 1 FastAPI replica.
patches:
  - target:
      kind: Deployment
      name: fastapi
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

commonLabels:
  environment: dev
