# ServiceAccount for the FastAPI pod.
#
# The GKE Workload Identity annotation tells GKE to expose the bound
# GSA's identity to pods using this KSA. The KSA → GSA binding is
# created in Terraform (terraform/modules/workload-identity/).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi
  annotations:
    iam.gke.io/gcp-service-account: REPLACE-WITH-FASTAPI-GSA-EMAIL
