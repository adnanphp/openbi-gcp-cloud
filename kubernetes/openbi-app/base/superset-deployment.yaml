# Apache Superset.
#
# Same Cloud SQL sidecar pattern.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      serviceAccountName: fastapi
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--auto-iam-authn"
            - "$(CLOUD_SQL_CONNECTION_NAME)"
          env:
            - name: CLOUD_SQL_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: openbi-db-credentials
                  key: instance
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: superset
          image: apache/superset:3.1.3
          ports:
            - containerPort: 8088
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openbi-superset-secret
                  key: secret_key
          envFrom:
            - configMapRef:
                name: openbi-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
# Superset secret key, synced from Secret Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbi-superset-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: openbi-superset-secret
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: openbi/dev/superset
        property: secret_key
