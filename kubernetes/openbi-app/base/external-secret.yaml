# Database credentials, synced from Secret Manager.
#
# Reads openbi/dev/db (created in G6) and creates a Kubernetes Secret.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbi-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: openbi-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openbi/dev/db
