# BackendConfig — configures the load balancer backend (health checks,
# timeouts, etc.).

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: openbi-backend-config
  namespace: openbi
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 8000
  connectionDraining:
    drainingTimeoutSec: 60
  timeoutSec: 30
