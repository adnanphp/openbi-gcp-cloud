# Example Ingress resources for GKE.
#
# GKE provisions a Cloud Load Balancer for each Ingress (or shares one
# if you use the same static IP). No controller to install.
#
# These are reference examples. The real OpenBI Ingresses are created
# in Phase G10.

# ----------------------------------------------------------------------
# External HTTP Ingress (no TLS)
# ----------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbi-api-http
  namespace: openbi
  annotations:
    # Reference the reserved static IP from the load-balancing module.
    kubernetes.io/ingress.global-static-ip-name: openbi-dev-lb-ip
    # Reference the BackendConfig for custom health check.
    cloud.google.com/backend-config: '{"default": "openbi-backend-config"}'
spec:
  ingressClassName: gce
  rules:
    - host: api.openbi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi
                port:
                  number: 8000
---
# ----------------------------------------------------------------------
# External HTTPS Ingress (managed certificate)
# ----------------------------------------------------------------------
# Only valid if `domain_name` was set in the load-balancing module
# (or a ManagedCertificate is created separately). Replace the
# managed-certificates annotation with the certificate's name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbi-api-https
  namespace: openbi
  annotations:
    kubernetes.io/ingress.global-static-ip-name: openbi-dev-lb-ip
    networking.gke.io/managed-certificates: openbi-dev-cert
    networking.gke.io/v1beta1.FrontendConfig: openbi-frontend-config
spec:
  ingressClassName: gce
  rules:
    - host: api.openbi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi
                port:
                  number: 8000
---
# ----------------------------------------------------------------------
# Internal Ingress (for services not exposed to the internet)
# ----------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbi-superset-internal
  namespace: openbi
  annotations:
    kubernetes.io/ingress.class: "gce-internal"
spec:
  rules:
    - host: superset.openbi.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset
                port:
                  number: 8088
