
Example ExternalSecret for OpenBI.
Reads openbi/dev/db from Secret Manager and creates a Kubernetes
Secret with the same fields.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
name: openbi-db-credentials
namespace: openbi
labels:
app.kubernetes.io/part-of: openbi-platform
spec:
refreshInterval: 1h
secretStoreRef:
name: gcp-secret-manager
kind: ClusterSecretStore
target:
name: openbi-db-credentials
creationPolicy: Owner
dataFrom:

extract:
key: openbi/dev/db
