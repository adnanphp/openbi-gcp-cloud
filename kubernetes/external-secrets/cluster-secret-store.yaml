
ClusterSecretStore — how ESO reaches Secret Manager.
Uses the GSA bound to ESO's KSA (see terraform/modules/secrets/).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
name: gcp-secret-manager
labels:
app.kubernetes.io/name: external-secrets
app.kubernetes.io/part-of: openbi-platform
spec:
provider:
gcpsm:
projectID: REPLACE-WITH-PROJECT-ID
auth:
workloadIdentity:
clusterLocation: REPLACE-WITH-REGION
clusterName: openbi-dev
serviceAccountRef:
name: external-secrets
namespace: external-secrets
